


name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend quality ──────────────────────────────────────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install ruff
      - name: Lint
        run: ruff check .

  typecheck:
    name: Type Check (Mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Type check
        run: mypy .

  test:
    name: Tests (Pytest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to DeepSource (optional)
        if: ${{ false }}
        uses: deepsourcelabs/test-coverage-action@v1

  # ── Frontend check ───────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --frozen-lockfile
      - name: Build
        run: npm run build

  # ── Docker image ─────────────────────────────────────────────────
  build:
    name: Build (Docker)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: jellynews:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run --rm -d --name jellynews-ci -p 8000:8000 \
            -e APP_SECRET_KEY=ci-test-key \
            jellynews:ci-test
          sleep 5
          curl -fsS --retry 5 --retry-delay 1 http://localhost:8000/healthz
          docker stop jellynews-ci

  # ── Vulnerability scan ───────────────────────────────────────────
  trivy:
    name: Trivy Scan
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: jellynews:ci-scan
          cache-from: type=gha
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: jellynews:ci-scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          limit-severities-for-sarif: true
      - name: Upload Trivy results to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

